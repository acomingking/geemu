<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>It's Friday!</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
}
canvas{
    display:block;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const phrase = "IT'S FRIDAY!";
const letters = [];

function buildText() {
    letters.length = 0;

    const size = Math.min(canvas.width / 10, 120);
    ctx.font = `bold ${size}px Arial`;

    const totalWidth = ctx.measureText(phrase).width;
    let x = canvas.width / 2 - totalWidth / 2;

    for (const ch of phrase) {
        const w = ctx.measureText(ch).width;

        letters.push({
            char: ch,
            homeX: x + w / 2,
            homeY: canvas.height / 2,
            x: x + w / 2,
            y: canvas.height / 2,
            vx: 0,
            vy: 0
        });

        x += w;
    }
}
buildText();

let timer = 0;
let exploded = false;

function explode() {
    exploded = true;

    letters.forEach(l => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 5 + Math.random() * 12;

        l.vx = Math.cos(angle) * speed;
        l.vy = Math.sin(angle) * speed;
    });

    setTimeout(() => {
        exploded = false;
    }, 3000);
}

setInterval(explode, 7000);

function draw() {
    requestAnimationFrame(draw);

    timer += 0.03;

    // Fancy nightclub background
    const hue = (timer * 50) % 360;

    ctx.fillStyle = `hsla(${hue},70%,10%,0.25)`;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Laser beams
    for(let i=0;i<6;i++){
        ctx.strokeStyle=`hsla(${(hue+i*60)%360},100%,60%,0.2)`;
        ctx.lineWidth=4;
        ctx.beginPath();
        ctx.moveTo(canvas.width/2,canvas.height/2);
        ctx.lineTo(
            canvas.width/2 + Math.cos(timer+i)*1000,
            canvas.height/2 + Math.sin(timer+i)*1000
        );
        ctx.stroke();
    }

    const size = Math.min(canvas.width / 10, 120);
    ctx.font = `bold ${size}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    letters.forEach((l,i)=>{

        if(exploded){

            l.x += l.vx;
            l.y += l.vy;

            l.vx *= 0.99;
            l.vy *= 0.99;

        } else {

            l.x += (l.homeX - l.x) * 0.08;
            l.y += (l.homeY - l.y) * 0.08;
        }

        ctx.save();

        const glow = 20 + Math.sin(timer*6+i)*15;

        ctx.shadowBlur = glow;
        ctx.shadowColor = `hsl(${hue+i*20},100%,60%)`;

        ctx.fillStyle = `hsl(${hue+i*20},100%,65%)`;

        ctx.translate(l.x, l.y);

        const rotate = exploded ? timer * 10 : Math.sin(timer+i)*0.1;
        ctx.rotate(rotate);

        ctx.fillText(l.char,0,0);

        ctx.restore();
    });

    // Surprise message during explosion
    if(exploded){
        ctx.font = "bold 50px Arial";
        ctx.fillStyle = "#fff";
        ctx.shadowBlur = 30;
        ctx.shadowColor = "#ff0";
        ctx.fillText(
            "🍻 WEEKEND MODE ACTIVATED 🍻",
            canvas.width/2,
            canvas.height*0.75
        );
    }
}

draw();
</script>
</body>
</html>
