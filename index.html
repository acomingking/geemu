<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geemu – Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; letter-spacing: 3px; color: #e94560; }
    #info { margin-bottom: 0.75rem; font-size: 0.95rem; color: #aaa; }
    #scoreboard { margin-bottom: 1rem; font-size: 1.1rem; }
    #scoreboard span { color: #e94560; font-weight: bold; }
    canvas {
      border: 3px solid #e94560;
      border-radius: 4px;
      background: #16213e;
    }
    #message {
      margin-top: 1rem;
      font-size: 1.1rem;
      min-height: 1.5rem;
      color: #f0a500;
    }
    #restart {
      margin-top: 0.75rem;
      padding: 0.5rem 1.5rem;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      display: none;
    }
    #restart:hover { background: #c73652; }
  </style>
</head>
<body>
  <h1>🐍 GEEMU</h1>
  <div id="info">Arrow keys or WASD to move</div>
  <div id="scoreboard">Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="message">Press any arrow key to start!</div>
  <button id="restart">Restart</button>
  <script src="game.js"></script>
</body>
</html>
